<style>
:root {
  --bg:     #111009;
  --gold:   #d4a85a;
  --gold-d: #9e7a40;
  --gold-p: #e8c880;
  --fg:     #e8e3db;
  --fg-d:   #a09a93;
  --fg-dd:  #6a6560;
  --parch:  #f5f1e8;
  --cream:  #faf7f2;
  --line:   #2a2724;
  --line2:  #343028;
  --card:   rgba(24,23,20,0.85);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0;
  -webkit-tap-highlight-color:transparent; /* kill blue flash on iOS/Android */
  outline:none; }
/* Restore focus outline for keyboard-only navigation (accessibility) */
:focus-visible { outline:1px solid rgba(196,154,82,.4); outline-offset:2px; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); }
body { font-family:'Jost',sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; }
@media (pointer:fine) { body { cursor:none; } }

/* ── cursor ── */
#cur   { width:6px;height:6px;background:var(--gold);border-radius:50%;position:fixed;z-index:9999;top:0;left:0;transform:translate(-50%,-50%);pointer-events:none;transition:transform .12s cubic-bezier(.4,0,.2,1); }
#cur-r { width:22px;height:22px;border:1px solid rgba(196,154,82,.3);border-radius:50%;position:fixed;z-index:9998;top:0;left:0;transform:translate(-50%,-50%);pointer-events:none;transition:border-color .2s; }
body.hovering #cur-r { border-color:rgba(196,154,82,.65); }

/* ── canvas bg ── */
#bg { position:fixed;inset:-12px;z-index:0;width:calc(100% + 24px);height:calc(100% + 24px); }

/* ── three.js canvas ── */
/* Canvas is rendered WIDER than the viewport (8vw extra, 4vw each side) so the
   right-corner crystal is never clipped when the scene shifts left on panel-open.
   margin-left:-4vw centres the oversized canvas; the extra right portion acts as
   a hidden buffer — the corner crystal lives there safely, WebGL never clips it. */
#three { position:fixed;top:0;left:0;z-index:1;pointer-events:none;touch-action:none;will-change:transform;transition:transform 1.6s cubic-bezier(.4,0,.1,1), filter 1.6s cubic-bezier(.4,0,.2,1);margin-left:-4vw; }

/* scene shifts left when panel is open — 3.5vw shift is now fully inside the 4vw buffer */
body.panel-open #three { transform:translateX(-3.5vw); }

/* ── UI layer ── */
#ui { position:fixed;inset:0;z-index:10;pointer-events:none; }

/* ── identity corner ── */
#ident {
  position:fixed; top:32px; left:40px; z-index:20;
  pointer-events:none;
  opacity:0; transform:translateY(-8px);
  transition:opacity 1.2s ease, transform 1.2s ease, filter 3.8s cubic-bezier(.25,.1,.25,1);
}
#ident.in { opacity:1; transform:translateY(0); }
/* breathing starts only after .breathing class is added (post-entry) */
#ident.breathing {
  animation: identBreathe 8s ease-in-out infinite alternate;
  animation-delay: 0s;
}

/* hint breathing on its inner wrapper to avoid clobbering translateX(-50%) */
#hint-inner.breathing {
  animation: hintBreathe 11s ease-in-out infinite alternate;
  animation-delay: -3.5s; /* phase-offset: starts mid-cycle, never in sync with ident */
}

@keyframes identBreathe {
  0%   { transform: translateY(0px);  }
  100% { transform: translateY(-1px); }
}
@keyframes hintBreathe {
  0%   { transform: translateY(0px);  }
  100% { transform: translateY(-1px); }
}

@media (prefers-reduced-motion:reduce) {
  #ident.breathing,
  #hint-inner.breathing { animation:none; }
}
.ident-name {
  font-family:'Playfair Display',serif;
  font-style:italic; font-weight:500;
  font-size:1.35rem; color:var(--cream);
  letter-spacing:.02em; line-height:1;
}
.ident-sub {
  font-family:'Jost',sans-serif; font-weight:400;
  font-size:.5rem; letter-spacing:.38em;
  text-transform:uppercase; color:var(--gold);
  margin-top:7px;
}

/* ── hint ── */
#hint {
  position:fixed; bottom:36px; left:50%; transform:translateX(-50%);
  z-index:20; text-align:center;
  opacity:0; transition:opacity 1s ease;
  pointer-events:none;
}
#hint.in { opacity:1; }
.view-dragging #hint { opacity:.14; }
.hint-txt {
  font-family:'Jost',sans-serif; font-weight:300;
  font-size:.5rem; letter-spacing:.36em;
  text-transform:uppercase; color:var(--fg-dd);
}
.hint-line {
  width:1px; height:28px; background:linear-gradient(to bottom,var(--gold-d),transparent);
  margin:10px auto 0;
  transform-origin: top center;
  animation: hintLinePulse 2.8s cubic-bezier(.4,0,.2,1) infinite;
}
@keyframes hintLinePulse {
  0%   { transform: scaleY(0);   opacity: 0; }
  18%  { transform: scaleY(1);   opacity: 1; }
  72%  { transform: scaleY(1);   opacity: 0.7; }
  100% { transform: scaleY(0);   opacity: 0; }
}

/* ── PANEL — right-side drawer ── */
#panel {
  position:fixed; inset:0; z-index:50;
  pointer-events:none;
}
#panel.on { pointer-events:all; }

.panel-bg {
  position:absolute; inset:0;
  background:rgba(4,3,2,.62);   /* [perf] 去掉全屏 backdrop-filter：它要对实时 WebGL 画布逐帧重采样 */
  opacity:0; transition:opacity .52s cubic-bezier(.4,0,.2,1);
}
#panel.on .panel-bg { opacity:1; }

.panel-inner {
  position:absolute; top:0; right:0; bottom:0;
  width:clamp(520px,72vw,1100px);
  overflow-y:auto;
  background:linear-gradient(175deg,rgba(18,17,15,.82) 0%,rgba(10,9,8,.88) 100%);
  /* [perf] 28px backdrop blur over the live WebGL canvas was re-computed every frame; panel is ~85% opaque so it was barely visible */
  background-color:rgba(10,9,8,.9);
  border-left:1px solid rgba(196,154,82,.10);
  box-shadow:-60px 0 120px rgba(0,0,0,.6);
  transform:translateX(102%);
  transition:transform .52s cubic-bezier(.22,1,.36,1);
  display:flex; flex-direction:column;
  will-change:transform;
}
#panel.on .panel-inner { transform:translateX(0); }
.panel-inner::-webkit-scrollbar { width:0; }
/* overflow-x:clip stops horizontal bleed without creating a new scroll container on Y,
   so the parallax body offset never gets clipped at the bottom edge */
.panel-inner { overflow-x:clip; }

/* sticky header */
/* All transitions share ONE duration + easing to avoid stagger jank.
   font-size transitions are replaced by transform:scale() — GPU-composited,
   no layout recalc, no frame skipping on clamp() values.              */
.panel-head {
  position:sticky; top:0; z-index:2;
  padding:40px 44px 0;
  background:rgba(14,13,12,.97);   /* [perf] 去掉 blur(28px)：粘性标题栏滑过实时画布时每帧重算模糊 */
  transition:padding .4s cubic-bezier(.4,0,.2,1);
}
.panel-head.scrolled { padding:18px 44px 0; }
.panel-head::after {
  content:'';
  display:block;
  height:1px;
  margin:16px 0 0;
  background:linear-gradient(to right,var(--gold-d),rgba(140,109,56,.12),transparent);
  transition:margin .4s cubic-bezier(.4,0,.2,1);
  transform:scaleX(0);
  transform-origin:left center;
}
/* Panel open: draw the line in once — no loop, no repeat */
#panel.on .panel-head::after {
  animation: panelRuleDraw .65s cubic-bezier(.22,1,.36,1) .32s forwards;
}
@keyframes panelRuleDraw {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}
.panel-head.scrolled::after { margin:10px 0 0; }
.panel-head-top {
  display:flex; align-items:flex-start;
  justify-content:space-between; margin-bottom:18px;
  position:relative; z-index:1;
}
/* eyebrow: fade + collapse via height (not max-height) for snappier feel */
.panel-eyebrow {
  font-family:'Jost',sans-serif; font-weight:400;
  font-size:.48rem; letter-spacing:.44em; text-transform:uppercase;
  color:var(--gold); margin-bottom:10px;
  overflow:hidden;
  opacity:1;
  transform-origin:top left;
  transition:opacity .3s cubic-bezier(.4,0,.2,1),
             transform .3s cubic-bezier(.4,0,.2,1),
             margin-bottom .4s cubic-bezier(.4,0,.2,1),
             max-height .4s cubic-bezier(.4,0,.2,1);
  will-change:opacity,transform;
  max-height:2em;
  position:relative; z-index:1;
}
/* Entry animation: letter-spacing expands from tight → normal, clip-path wipes left→right */
/* Triggers fresh each time panel opens (class added/removed resets animation) */
#panel.on .panel-eyebrow {
  animation: eyebrowReveal .72s cubic-bezier(.22,1,.36,1) .18s both;
}
@keyframes eyebrowReveal {
  from {
    opacity: 0;
    letter-spacing: -0.05em;
    clip-path: inset(0 100% 0 0);
  }
  to {
    opacity: 1;
    letter-spacing: .44em;
    clip-path: inset(0 0% 0 0);
  }
}

  #panel.on .panel-eyebrow { animation: none; }

  opacity:0;
  transform:translateY(-4px) scaleY(0.6);
  margin-bottom:0;
  max-height:0;
}

.panel-title {
  font-family:'Playfair Display',serif; font-style:italic; font-weight:500;
  font-size:clamp(2rem,3.8vw,2.9rem); color:var(--parch);
  letter-spacing:-.02em; line-height:.95;
  transform-origin:left center;
  /* No CSS transition here — JS drives scale per-frame for true scroll tracking.
     A transition would add lag/rubber-band feel against rAF writes. */
  will-change:transform;
  display:inline-block;
}
.panel-head.scrolled .panel-title { /* scale now driven by JS inline style */ }

  will-change:transform;

  stroke:var(--gold);
}

  stroke:var(--fg-dd);
  stroke-width:1.3;
  stroke-linecap:round;
  fill:none;

}

.panel-close:hover .cl-line:nth-child(4) { transition-delay: 0ms; }

<script>
// Global lightbox meta store — populated by openPanel() each time images render
var _lbMeta = {};

/**
 * esc(str) — HTML-escape a plain-text value before splicing into innerHTML strings.
 * Converts the five characters that can break out of an HTML context:
 *   & → &amp;   < → &lt;   > → &gt;   " → &quot;   ' → &#039;
 *
 * Usage: wherever a data value (title, body text, image caption, etc.) is
 * interpolated directly into an HTML string, wrap it: esc(value).
 * Structural HTML tags and fixed style= attributes do NOT need wrapping.
 *
 * Pattern from: gomakethings.com/preventing-cross-site-scripting-attacks-when-using-innerhtml
 * and OWASP DOM XSS Prevention Cheat Sheet.
 */
function esc(str) {
  if (str == null) return '';
  var div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script>
// ══════════════════════════════════════════════
// CURSOR — desktop only
// Ring uses velocity-adaptive lerp (14islands pattern):
//   • speed computed from mouse delta each frame
//   • lerp factor = base + speed-based boost, clamped [0.08, 0.28]
//   • when mouse stops, factor decays back to base → ring glides in cleanly
//   • no CSS transition on position — pure rAF, zero "catch-up" artefact
// ══════════════════════════════════════════════
(function(){
  if('ontouchstart' in window || navigator.maxTouchPoints > 0) return;
  var c  = document.getElementById('cur');
  var r  = document.getElementById('cur-r');

  // Mouse target
  var mx = 0, my = 0;
  // Previous mouse position (for velocity — must be declared here to stay in IIFE scope)
  var pmx = 0, pmy = 0;
  // Ring current position
  var rx = 0, ry = 0;
  // Lerp factor bounds (distance-adaptive, no intermediate smoothing)
  var lerpF     = 0.22;
  var LERP_BASE = 0.22;
  var LERP_MAX  = 0.60;

  // Scale state tracked in JS so we can compose with translate cleanly
  var curScale  = 1.0;  // inner dot scale target
  var ringScale = 1.0;  // ring scale target
  var curScaleC = 1.0;  // inner dot scale current (lerped)
  var ringScaleC= 1.0;  // ring scale current (lerped)

  // [perf] 位置改用 transform（合成器属性），不再写 left/top（会触发布局+重绘，飞行期间每帧都在抢主线程）。
  //        圆点原来靠 left/top 瞬时跟手，没有位移过渡；改成 transform 后要关掉它的 CSS transform 过渡，否则会拖尾。
  c.style.transition = 'none';
  document.addEventListener('mousemove', function(e){
    pmx = mx; pmy = my;
    mx = e.clientX; my = e.clientY;      // 只记录，统一在下一帧 tick 里写一次
  }, {passive:true});

  // Hover state wired to scale targets
  var _hoverObs = new MutationObserver(function(){
    var h = document.body.classList.contains('hovering');
    curScale  = h ? 1.8 : 1.0;
    ringScale = h ? 1.4 : 1.0;
  });
  _hoverObs.observe(document.body, {attributes:true, attributeFilter:['class']});

  var _lastRt = '', _lastCt = '';
  (function tick(){
    // Velocity: raw delta between true mouse pos and ring pos (no double-smoothing)
    var dx    = mx - rx;
    var dy    = my - ry;
    var dist  = Math.sqrt(dx*dx + dy*dy);

    // Lerp factor: higher base + distance-based boost so ring snaps fast when far,
    // glides softly when nearly arrived. No intermediate smoothing of lerpF itself.
    var boost = Math.min(dist * 0.004, LERP_MAX - LERP_BASE);
    lerpF = LERP_BASE + boost;

    // Lerp ring position
    rx += dx * lerpF;
    ry += dy * lerpF;

    // Lerp scale values
    curScaleC  += (curScale  - curScaleC)  * 0.20;
    ringScaleC += (ringScale - ringScaleC) * 0.20;

    var rt = 'translate3d(' + rx.toFixed(2) + 'px,' + ry.toFixed(2) + 'px,0) translate(-50%,-50%) scale(' + ringScaleC.toFixed(3) + ')';
    var ct = 'translate3d(' + mx + 'px,' + my + 'px,0) translate(-50%,-50%) scale(' + curScaleC.toFixed(3) + ')';
    if(rt !== _lastRt){ r.style.transform = rt; _lastRt = rt; }     // 没变化就不写，鼠标静止时主线程零开销
    if(ct !== _lastCt){ c.style.transform = ct; _lastCt = ct; }

    requestAnimationFrame(tick);
  })();
})();

// ══════════════════════════════════════════════
// PARTICLE TRAIL — desktop only
// Isolated canvas at z-index:9000, above grain, below cursor.
// Event-driven spawn (not per-frame) — 2 particles per mousemove.
// Each particle inherits mouse velocity + random scatter.
// Hard cap 120 particles. Zero dependencies.
// ══════════════════════════════════════════════
(function(){
  var COLORS = ['#d4a85a','#e8c880','#c49a52','#f0d898','#b8922e'];
  var MAX    = 120;
  var LIFE   = 42;
  var SPAWN  = 2;
  var particles = [];
  var rafId  = null;

  // Canvas created immediately — works on all devices including touch
  // (burst effect needed on mobile too; trail spawn guarded separately below)
  var pc = document.createElement('canvas');
  pc.style.cssText = 'position:fixed;inset:0;z-index:9100;pointer-events:none;width:100%;height:100%';
  document.body.appendChild(pc);
  var ctx = pc.getContext('2d');
  var W = pc.width  = window.innerWidth;
  var H = pc.height = window.innerHeight;
  window.addEventListener('resize', function(){
    W = pc.width  = window.innerWidth;
    H = pc.height = window.innerHeight;
  }, {passive:true});

  function tick(){
    if(!ctx) return;
    ctx.clearRect(0, 0, W, H);
    var alive = false;
    for(var i = 0; i < particles.length; i++){
      var p = particles[i];
      if(p.life <= 0) continue;
      alive = true;
      p.vx *= 0.91;
      p.vy  = p.vy * 0.91 + 0.04;
      p.x  += p.vx;
      p.y  += p.vy;
      p.life--;
      var t      = p.life / p.maxLife;
      var alpha  = t * t * (p.isShard ? 0.055 : 0.14);
      var radius = p.r * (0.3 + t * 0.7);
      ctx.globalAlpha = alpha;
      if(p.isShard){
        var len = p.r * (1.8 + t * 2.2);
        var cos = Math.cos(p.rot), sin = Math.sin(p.rot);
        ctx.beginPath();
        ctx.moveTo(p.x - cos * len, p.y - sin * len);
        ctx.lineTo(p.x + cos * len, p.y + sin * len);
        ctx.strokeStyle = p.color;
        ctx.lineWidth   = 0.9 + t * 0.8;
        ctx.lineCap     = 'round';
        ctx.stroke();
      } else {
        // Soft-edged dot: wide radial gradient, fade starts immediately from center
        var rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius * 3.2);
        rg.addColorStop(0,    p.color);
        rg.addColorStop(0.18, p.color);
        rg.addColorStop(0.65, 'rgba(0,0,0,0)');
        rg.addColorStop(1,    'rgba(0,0,0,0)');
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius * 3.2, 0, Math.PI * 2);
        ctx.fillStyle = rg;
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if(alive){ rafId = requestAnimationFrame(tick); }
    else      { rafId = null; }
  }

  // Exposed globally BEFORE touch guard — corner crystal DOM clicks work on all devices
  window.burstCrystal = function(sx, sy){
    var BURST_COLORS = ['#f0d898','#e8c880','#d4a85a','#ffffff','#c49a52','#ffe8b0'];
    for(var i = 0; i < 38; i++){
      if(particles.length >= MAX) particles.shift();
      var angle = (i / 38) * Math.PI * 2 + (Math.random() - 0.5) * 0.28;
      var speed = 3.5 + Math.random() * 5.5;
      var life  = 38 + Math.floor(Math.random() * 22);
      particles.push({
        x: sx + (Math.random() - 0.5) * 8,
        y: sy + (Math.random() - 0.5) * 8,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 0.9 + Math.random() * 1.6,
        rot: angle, life: life, maxLife: life,
        color: BURST_COLORS[Math.floor(Math.random() * BURST_COLORS.length)],
        isShard: true,
      });
    }
    if(!rafId) rafId = requestAnimationFrame(tick);
  };

  // Trail spawn: desktop only
  if('ontouchstart' in window || navigator.maxTouchPoints > 0) return;

  var mx = 0, my = 0, pmx = 0, pmy = 0;

  // Track mouse velocity
  document.addEventListener('mousemove', function(e){
    pmx = mx; pmy = my;
    mx = e.clientX; my = e.clientY;

    // Don't spawn if panel or lightbox is open — keeps UI clean
    if(document.body.classList.contains('panel-open')) return;
    if(document.getElementById('lb') &&
       document.getElementById('lb').classList.contains('on')) return;

    var vx = (mx - pmx) * 0.35;  // inherit fraction of mouse velocity
    var vy = (my - pmy) * 0.35;
    var speed = Math.sqrt(vx*vx + vy*vy);

    // Only spawn if mouse is actually moving fast enough
    if(speed < 1.2) return;

    for(var i = 0; i < SPAWN; i++){
      if(particles.length >= MAX) particles.shift(); // evict oldest

      // Random scatter angle ±35° around velocity direction
      var angle  = Math.atan2(vy, vx) + (Math.random() - 0.5) * 1.2;
      var mag    = speed * (0.3 + Math.random() * 0.55);
      var radius = 1.2 + Math.random() * 2.2;

      particles.push({
        x:  mx + (Math.random() - 0.5) * 4,
        y:  my + (Math.random() - 0.5) * 4,
        vx: Math.cos(angle) * mag,
        vy: Math.sin(angle) * mag,
        r:  radius,
        life: LIFE,
        maxLife: LIFE,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
      });
    }
  }, {passive:true});

  // Kick off trail loop on first mousemove (lazy start)
  document.addEventListener('mousemove', function(){
    if(!rafId) rafId = requestAnimationFrame(tick);
  }, {passive:true});

})();

// ══════════════════════════════════════════════
// GLOBAL SCENE STATE — shared bus between stars (Canvas 2D) and crystals (Three.js)
// Stars read this every frame — zero coupling, no architecture changes needed.
// ══════════════════════════════════════════════
window._sceneState = {
  shockWaves: [],
  panelDrift: 0,
  panelDriftTarget: 0,
  // Caustic projection data — written each frame by Three.js, read by star canvas
  // Each entry: { x, y, sc, hoverT, crystalScale, ph0, ph1, ph2 }
  causticPts: [],
  // Click afterglow — positive afterimage residual, ref: ScienceDirect retinal persistence data
  // Each entry: { x, y, alpha } — alpha decays exponentially each frame (* 0.962)
  // Cap 3 simultaneous pulses — oldest evicted when full
  glowPulses: [],
};

// ══════════════════════════════════════════════
// STARS BACKGROUND (Canvas 2D — your original system)
// ══════════════════════════════════════════════
(function(){
  var c=document.getElementById('bg');
  var ctx=c.getContext('2d');
  var W,H;
  function resize(){
    W=c.width=window.innerWidth;
    H=c.height=window.innerHeight;

    // full viewport without blank strips (bug: old canvas stayed at init size).
    // Guard: _starOffscreen is created later in this IIFE — only call rebuild

    if(typeof _starOffscreen !== 'undefined' && _starOffscreen) _rebuildStarOffscreen();
  }
  resize(); window.addEventListener('resize',resize);

  // ★ TABLET FIX: isTablet MUST be defined first — isMob explicitly excludes tablets.
  //   平板（触控 + 宽度≥769）永远走桌面分支，isMob 只代表真正的手机。
  //   这是所有平板渲染问题的根本修复：fog椭圆、行星位置、星星数量、视差方式全部归位。
  var isTablet = (('ontouchstart' in window) || navigator.maxTouchPoints > 0) && window.innerWidth >= 769;
  var isMob = !isTablet && (('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.innerWidth < 768);

  // ── Performance tier detection ──
  // Multi-signal: CPU cores + RAM + GPU renderer string + mobile flag.
  // ref: javaspring.net/blog/using-javascript-to-detect-device-cpu-gpu-performance
  // ref: MDN WebGL best practices — avoid highp fragment ops on low-end GPUs
  // Three tiers: 'low' | 'mid' | 'high'
  // Determined ONCE before any render loop starts — never re-evaluated per frame.
  var _perf = (function(){
    var cores  = navigator.hardwareConcurrency || 4;
    var mem    = navigator.deviceMemory        || 4; // undefined on Firefox/Safari → assume 4
    // WebGL renderer string — identifies integrated / mobile GPUs by name
    var gpuStr = '';
    try {
      var _gl  = document.createElement('canvas').getContext('webgl');
      var _ext = _gl && _gl.getExtension('WEBGL_debug_renderer_info');
      if(_ext) gpuStr = (_gl.getParameter(_ext.UNMASKED_RENDERER_WEBGL) || '').toLowerCase();
    } catch(e){}
    // Known weak GPU patterns: Intel UHD/HD integrated, Mali-4xx/5xx, Adreno 3xx, PowerVR
    var weakGPU = /intel (uhd|hd graphics [0-9]{3,4}$)|mali-[45]|adreno [23][0-9][0-9]|powervr/.test(gpuStr);

    if(isMob || cores < 4 || mem < 4 || weakGPU){
      return 'low';
    } else if(cores < 8 || mem < 8){
      return 'mid';
    }
    return 'high';
  })();

  // Expose globally so Three.js section can read it
  window._perfTier = _perf;

  // Low-end: restore grain to reasonable level on mobile (was .10 — too flat)
  if(_perf === 'low'){
    var _grainStyle = document.createElement('style');
    _grainStyle.textContent = isMob
      ? 'body::after { opacity: .22 !important; }'   // mobile: decent grain texture
      : 'body::after { opacity: .10 !important; }';  // non-mobile low-end: keep cheap

  var _staticStars = []; // baked into offscreen canvas after pl is defined
  var _movingStars = [];
  var _flickerStars = [];

  // ITU-R BT.601 star color distribution: ~60% warm white (F/G type), ~25% blue-white (A/B type), ~15% warm gold (K type)
  // Performance: 15996 static stars drawn ONCE to offscreen canvas, blit each frame (1 drawImage vs 16000 arcs)
  // Only 4 "wandering" stars drawn per-frame — simulate Barnard's Star proper-motion outliers
  var _MOVING_STARS = 4;
  var _movingAssigned = 0;

  var tiers = isMob
    ? [{n:14000,rMin:.02,rMax:.06,aMin:.092,aMax:.173,sp:.0015,dr:.00004,dMin:0.08,dMax:0.28},
       {n:2800, rMin:.06,rMax:.15,aMin:.173,aMax:.368,sp:.0035,dr:.00007,dMin:0.32,dMax:0.62},
       {n:380,  rMin:.15,rMax:.65,aMin:.380,aMax:.720,sp:.006, dr:.00012,dMin:0.68,dMax:1.00}]
    : [{n:30000,rMin:.02,rMax:.06,aMin:.140,aMax:.260,sp:.0015,dr:.000028,dMin:0.08,dMax:0.28},
       {n:2000, rMin:.06,rMax:.15,aMin:.260,aMax:.520,sp:.0035,dr:.000050,dMin:0.32,dMax:0.62},
       {n:400,  rMin:.15,rMax:.65,aMin:.520,aMax:.900,sp:.006, dr:.000085,dMin:0.68,dMax:1.00}];
  // desktop total: 13596 + 2000 + 400 = 15996 static + 4 moving = 16000

  // Star color types — based on Tycho-2 catalog distribution (Clarkvision.com analysis)
  // Real sky: mostly white/yellow-white, many orange, very few blue
  // M type ~75% (orange-red), K type ~12% (orange), G type ~7.5% (yellow-white),
  // F type ~3% (white), A/B type <1% (blue-white) — visible bright stars skew bluer
  // For naked-eye stars, brighter bias means more A/B/F types than galactic average
  var _starColors = [
    {r:255,g:252,b:240}, // F/G type — pure white (30%)
    {r:255,g:252,b:240},
    {r:255,g:252,b:240},
    {r:255,g:244,b:210}, // G/K type — warm yellow-white (25%)
    {r:255,g:244,b:210},
    {r:255,g:228,b:168}, // K type — warm gold/orange (20%)
    {r:255,g:228,b:168},
    {r:255,g:200,b:130}, // K/M type — orange (12%)
    {r:220,g:235,b:255}, // A type — blue-white (8%)
    {r:255,g:180,b:100}, // M type — deep orange-red (5%)
  ];

  // Planet position for occultation — calculated after pl is defined below

  tiers.forEach(function(cfg){
    for(var i=0;i<cfg.n;i++){
      var isMoving = _movingAssigned < _MOVING_STARS && Math.random() < 0.015;
      if(isMoving) _movingAssigned++;
      var _col = _starColors[Math.floor(Math.random() * _starColors.length)];
      var star = {
        x:Math.random(), y:Math.random(),
        r:cfg.rMin+Math.random()*(cfg.rMax-cfg.rMin),
        base:cfg.aMin+Math.random()*(cfg.aMax-cfg.aMin),
        sp:cfg.sp*(.6+Math.random()*.8), ph:Math.random()*Math.PI*2,
        dx: isMoving ? (Math.random()-.5)*cfg.dr : 0,
        dy: isMoving ? (Math.random()-.5)*cfg.dr*.5 : 0,
        big: cfg.rMax>=0.8,
        depth: cfg.dMin + Math.random()*(cfg.dMax-cfg.dMin),
        cr: _col.r, cg: _col.g, cb: _col.b,
      };

        _movingStars.push(star);

        var _canFlicker = cfg.rMax >= 0.06 && Math.random() < 0.15;
        if(_canFlicker){

          _staticStars.push(star);
        }

  if(_movingAssigned < _MOVING_STARS){
    var _toAssign = _MOVING_STARS - _movingAssigned;
    for(var _si = 0; _si < _staticStars.length && _toAssign > 0; _si++){
      _movingStars.push(_staticStars.splice(_si, 1)[0]);
      _si--;
      _toAssign--;
    }
    _movingStars.forEach(function(s){

    { id:'video', label:'Video', cn:'影像', num:'06',

      body:'《Dreaming Inside an Elastic Space》是一個互動式影片作品，透過「彈性空間」的概念，探索憂鬱與自殺意念——也就是人的內在心理狀態如何實際改變周圍的世界。\n\n作品沒有戲劇化或誇張的表現，而是讓觀者親身進入這些情緒狀態。你的每個選擇都會影響空間：物體變得更重或更輕，房間收縮、擴張、扭曲，聲音也模糊了思想與環境的界線。\n\n每一次決定都會重新塑造「心靈與空間」之間的彈性關係，而你最後抵達的地方，反映了你在這個可變世界中的選擇與路徑。\n\nDreaming Inside an Elastic Space is an interactive video exploring elastic space through the lens of depression and suicidal ideation — how interior psychological states physically reshape the world around us.\n\nThere is no spectacle, no dramatization. Instead, you inhabit these emotional conditions. Objects gain or lose weight. Rooms contract, expand, distort. Sound bends the boundaries between thought and environment.\n\nCreated by Jin Hangtao · Digital Video · Accademia di Belle Arti di Roma.',

          im.classList.add('pi-in');
          if(sk){ sk.classList.add('pi-out'); setTimeout(function(){ if(sk.parentNode) sk.parentNode.removeChild(sk); }, 800); }
          setTimeout(function(){ im.classList.add('pi-done'); }, 1100);
        }
      } else {                                            // finished but empty = failed → retry (cache-busted), max 3
        var n = +(im.dataset.healTry || 0);
        if(n < 3){
          im.dataset.healTry = n + 1;
          var base = src.replace(/([?&])_h=\d+/, '').replace(/[?&]$/, '');
          im.src = base + (base.indexOf('?') < 0 ? '?' : '&') + '_h=' + Date.now();
        }
      }
    });
  };

  function _bindCollapseButtons(root){
    var btns = root.querySelectorAll('[data-clp-body]');
    btns.forEach(function(btn){
      var bodyId  = btn.getAttribute('data-clp-body');
      var btnId   = btn.getAttribute('data-clp-btn');
      var wrapId  = btn.getAttribute('data-clp-wrap');
      var colH    = btn.getAttribute('data-clp-h');
      btn.addEventListener('click', function(){
        var el   = document.getElementById(bodyId);
        var self = document.getElementById(btnId);
        var wrap = wrapId ? document.getElementById(wrapId) : null;
        if(!el || !self) return;
        var expanded = el.getAttribute('data-exp') === '1';
        if(expanded){
          // Collapse: animate to scrollHeight first (needed for transition from auto),
          // force reflow so the browser registers the starting point, then set target.
          el.style.maxHeight = el.scrollHeight + 'px';
          el.getBoundingClientRect(); // force reflow
          el.style.maxHeight = colH;
          el.setAttribute('data-exp', '0');
          self.textContent = '\u2014 READ MORE';
          if(wrap) wrap.classList.remove('expanded');
        } else {
          el.style.maxHeight = el.scrollHeight + 'px';
          el.setAttribute('data-exp', '1');
          self.textContent = '\u2014 COLLAPSE';
          if(wrap) wrap.classList.add('expanded');
        }
        self.style.transform = 'scale(0.93)';
        setTimeout(function(){ self.style.transform = ''; }, 150);
      });
    });
  }
  // ── Stat card binder ──
  // Called after panelBody.innerHTML is set. Wires stat-box clicks via
  // addEventListener — replaces the window._openPanel / window._sec globals
  // that the old inline onclick strings depended on.
  function _bindStatCards(root){
    var cards = root.querySelectorAll('[data-stat-target]');
    cards.forEach(function(card){
      var targetId = card.getAttribute('data-stat-target');
      var sec = SECTIONS.filter(function(s){ return s.id === targetId; })[0];
      if(!sec) return;
      card.addEventListener('click', function(e){
        // Ripple effect
        var rect = card.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height);
        var rip  = document.createElement('span');
        rip.className = 'stat-ripple';
        rip.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+(e.clientX-rect.left-size/2)+'px;top:'+(e.clientY-rect.top-size/2)+'px;';
        card.appendChild(rip);
        setTimeout(function(){ rip.remove(); }, 600);
        // Open the target panel after ripple starts
        setTimeout(function(){ openPanel(sec); }, 180);
      });
    });
  }

            'rotateY(' + cur.ry.toFixed(3) + 'deg) ' +

    return { I:I, w:w, lever:_rndUnit({x:0,y:0,z:0}) };
  }
  function _rbDeriv(I, w, out){
    out[0] = (I[1] - I[2]) * w[1] * w[2] / I[0];
    out[1] = (I[2] - I[0]) * w[2] * w[0] / I[1];
    out[2] = (I[0] - I[1]) * w[0] * w[1] / I[2];
  }
  var _rbk1=[0,0,0], _rbk2=[0,0,0], _rbk3=[0,0,0], _rbk4=[0,0,0], _rbt=[0,0,0];
  function _rbStep(group, B, dt){
    if(!B || dt <= 0) return;
    dt = Math.min(dt, 0.1);
    var n = Math.max(1, Math.ceil(dt / 0.02)), h = dt / n, I = B.I, w = B.w;
    for(var s=0; s<n; s++){
      var w0 = w[0], w1 = w[1], w2 = w[2];
      _rbDeriv(I, w, _rbk1);
      _rbt[0] = w0 + 0.5*h*_rbk1[0]; _rbt[1] = w1 + 0.5*h*_rbk1[1]; _rbt[2] = w2 + 0.5*h*_rbk1[2]; _rbDeriv(I, _rbt, _rbk2);
      _rbt[0] = w0 + 0.5*h*_rbk2[0]; _rbt[1] = w1 + 0.5*h*_rbk2[1]; _rbt[2] = w2 + 0.5*h*_rbk2[2]; _rbDeriv(I, _rbt, _rbk3);
      _rbt[0] = w0 + h*_rbk3[0];     _rbt[1] = w1 + h*_rbk3[1];     _rbt[2] = w2 + h*_rbk3[2];     _rbDeriv(I, _rbt, _rbk4);
      w[0] = w0 + h/6*(_rbk1[0] + 2*_rbk2[0] + 2*_rbk3[0] + _rbk4[0]);
      w[1] = w1 + h/6*(_rbk1[1] + 2*_rbk2[1] + 2*_rbk3[1] + _rbk4[1]);
      w[2] = w2 + h/6*(_rbk1[2] + 2*_rbk2[2] + 2*_rbk3[2] + _rbk4[2]);
      var mx = (w0 + w[0])*0.5, my = (w1 + w[1])*0.5, mz = (w2 + w[2])*0.5;   // 区间中点角速度
      var wl = Math.sqrt(mx*mx + my*my + mz*mz);
      if(wl > 1e-9){
        _rbAx.set(mx/wl, my/wl, mz/wl);
        _rbDq.setFromAxisAngle(_rbAx, wl*h);
        group.quaternion.multiply(_rbDq);
        group.quaternion.normalize();
      }
    }
  }
  // 外力矩（世界系力 dirW 作用在体坐标系压力中心 lever 上）→ 改变体坐标角速度
  function _rbTorque(group, B, dirW, k, dt){
    if(!B) return;
    _rbInv.copy(group.quaternion).invert();
    _rbV.set(dirW.x, dirW.y, dirW.z).applyQuaternion(_rbInv);
    var L = B.lever;
    B.w[0] += (L.y*_rbV.z - L.z*_rbV.y) * k * dt / B.I[0];
    B.w[1] += (L.z*_rbV.x - L.x*_rbV.z) * k * dt / B.I[1];
    B.w[2] += (L.x*_rbV.y - L.y*_rbV.x) * k * dt / B.I[2];
  }

  for(var mi=0; mi<MINI_COUNT; mi++){

  // ── 闪光活跃度：间歇性（intermittent），不是恒定节拍 ──
  // 物理依据：平面晶面的镜面反射只出现在 法线 ≈ 平分(光源, 观察者) 的极窄角域（Blinn-Phong / Ward 波瓣）。
  // 小天体光变曲线里的镜面闪（specular flash/glint）是稀疏、不规则的尖峰；
  // 是否出现取决于自旋轴相对 太阳-观察者 的几何（相位角、自旋轴倾角），而非固定节拍；
  // 翻滚体（非主轴自转, NPA rotators）的闪光序列准周期、强弱起伏（Kaasalainen 2001, Icarus;
  // Mancuso et al. 2025, A&A —— 流星体旋转导致的准周期光变）。
  // 这里用「状态切换 + 平滑」两态过程：每颗石头在 安静期(多数) / 活跃期(少数) 间随机切换，
  // 驻留时间服从指数分布；活跃度平方偏斜 → 多数时间很低、偶尔很高。
  function _glintStep(m, dt, tt){
    var g = m.gl;
    if(!g){ g = m.gl = { cur: 0.02 + Math.random()*0.08, tgt: 0.05, next: Math.random()*8, ph: Math.random()*6.283 }; }
    g.next -= dt;
    if(g.next <= 0){
      var u = Math.random();
      g.tgt = u < 0.62 ? 0.02 + Math.random()*0.08          // quiet: almost no flashes
            : u < 0.90 ? 0.12 + Math.random()*0.28          // occasional
            :            0.55 + Math.random()*0.45;         // active spell (rare)
      g.next = -Math.log(1 - Math.random()) * (g.tgt > 0.5 ? 3.5 : 9) + 2;
    }
    g.cur += (g.tgt - g.cur) * (1 - Math.exp(-dt / 1.8));
    var w = 0.65 + 0.35*Math.sin(tt*0.23 + g.ph)*Math.sin(tt*0.071 + g.ph*1.7);
    m.mat.uniforms.uGlint.value = g.cur * g.cur * 1.6 * w;
  }

  // ══════════════════════════════════════════════════════════════════
  //  小石头出现逻辑 —— 拟真宇宙碎屑环境（不再有任何“凭空冒出”）
  //
  //  参考的物理图景：
  //   1) 主流（prevailing flow）：碎屑盘 / 小行星带里的物质有共同的公转方向，速度分布集中、
  //      方向离散很小（Keplerian shear + 低离散度），所以石头顺着同一个大方向、从视野外很远处飞入。
  //   2) 碰撞碎裂（collisional cascade, Dohnanyi 1969）：大块天体撞碎后产生幂律尺寸分布的碎片，
  //      碎片 = 母体速度 + 抛射速度；动量守恒 → 小块飞得快、大块飞得慢，母体因此反冲并变小。
  //   3) 彗星尘埃流 / 流星体流（meteoroid stream）：同源颗粒沿同一轨道成串排列，速度几乎一致，
  //      形成“串珠状”成团（clumping），而不是均匀随机。
  //   4) 气体拖曳 / 激波（Epstein drag, Weidenschilling 1977）：一阵波（如星风、抛射物前沿）扫过时，
  //      颗粒按 a = (v_gas − v)/t_stop 被带动，t_stop 随尺寸增大 → 小石头被吹得更猛，大石头更迟钝；
  //      波前陡峭、尾部拖长。被吹动的石头还会被拖曳力矩带得更快旋转。
  //   5) 到达率是泊松过程（随机但有涨落），不是固定节拍。
  //
  //  所有石头都从“视锥之外”的上游入场；母体碎裂时碎片从母体内部迸出，且母体当场变小、发光。
  // ══════════════════════════════════════════════════════════════════
  function _miniShellR(){ return Math.max(Math.hypot(visW, visH) * 1.7, 640); }
  function _rndUnit(out){
    var u = Math.random()*2 - 1, th = Math.random()*Math.PI*2, r = Math.sqrt(1 - u*u);
    out.x = r*Math.cos(th); out.y = u; out.z = r*Math.sin(th);
    return out;
  }
  var _su = {x:0,y:0,z:0};
  function _norm(o){ var l = Math.sqrt(o.x*o.x+o.y*o.y+o.z*o.z) + 1e-9; o.x/=l; o.y/=l; o.z/=l; return o; }
  function _gauss(){ return (Math.random()+Math.random()+Math.random()-1.5) / 0.5; }   // ≈ N(0,1)
  function _volPoint(out, k){
    k = k || 1;
    out.x = (Math.random()-.5) * visW * 2.1 * k;
    out.y = (Math.random()-.5) * visH * 2.1 * k;
    out.z = (Math.random()-.5) * 700 * k;
    return out;
  }
  // 偏向屏幕平面的随机方向（纯朝向镜头的流动几乎看不出来，所以 z 分量压小）
  function _rndFlowDir(out){
    var a = Math.random()*Math.PI*2;
    out.x = Math.cos(a); out.y = Math.sin(a)*0.7; out.z = (Math.random()-.5)*0.9;
    return _norm(out);
  }

  // ── 主流方向：缓慢转向（几十秒量级），而不是每颗石头各飞各的 ──
  // 每次进入页面都换一套“宇宙天气”：主流方向、波的方向、首波时间都不同。
  // 上一次的方向记在 localStorage 里，这一次强制与它相差至少 ~80°，避免“每次一模一样”。
  var _VKEY = 'jht_cosmos_v1', _last = {};
  try{ _last = JSON.parse(localStorage.getItem(_VKEY) || '{}') || {}; }catch(e){ _last = {}; }
  function _saveCosmos(){ try{ localStorage.setItem(_VKEY, JSON.stringify(_last)); }catch(e){} }
  function _angDiff(a, b){ var d = Math.abs(a-b) % (Math.PI*2); return d > Math.PI ? Math.PI*2 - d : d; }
  function _pickAngle(prev, minSep){
    var a, n = 0;
    do{ a = Math.random()*Math.PI*2; n++; } while(prev != null && _angDiff(a, prev) < minSep && n < 40);
    return a;
  }
  function _dirFromAngle(out, a){
    out.x = Math.cos(a); out.y = Math.sin(a)*0.7; out.z = (Math.random()-.5)*0.9;
    return _norm(out);
  }
  var _flowA = _pickAngle(_last.flowA, 1.4);
  _last.flowA = _flowA; _saveCosmos();
  var _flow    = _dirFromAngle({x:0,y:0,z:0}, _flowA);
  var _flowTgt = _dirFromAngle({x:0,y:0,z:0}, _flowA);
  window._miniFlowTick = function(dt){
    var k = Math.min(1, dt*0.04);
    _flow.x += (_flowTgt.x-_flow.x)*k; _flow.y += (_flowTgt.y-_flow.y)*k; _flow.z += (_flowTgt.z-_flow.z)*k;
    _norm(_flow);
  };
  (function _turnFlow(){
    _flowA = _pickAngle(_flowA, 0.9);                              // 每次转向至少偏 ~50°
    _last.flowA = _flowA; _saveCosmos();
    _dirFromAngle(_flowTgt, _flowA);
    setTimeout(_turnFlow, 50000 + Math.random()*40000);
  })();

  // ── 视锥判断：保证入场点一定在镜头看不到的地方 ──
  var _pv = new THREE.Vector3();
  function _inView(px, py, pz){
    _pv.set(px,py,pz).applyMatrix4(camera.matrixWorldInverse);
    if(_pv.z > -camera.near) return false;                       // 在相机背后
    _pv.set(px,py,pz).project(camera);
    return Math.abs(_pv.x) < 1.5 && Math.abs(_pv.y) < 1.5 && _pv.z < 1;
  }
  function _pushOffscreen(p, d, R){                               // 沿上游方向后退，直到看不见
    for(var i=0; i<10 && _inView(p.x,p.y,p.z); i++){
      p.x -= d.x*R*0.12; p.y -= d.y*R*0.12; p.z -= d.z*R*0.12;
    }
    return p;
  }
  function _sizeBias(m){ return 1.12 - 0.24*Math.min(1, (m.scale-2.5)/5.5); }   // 小块略快

  function _arm(m, px,py,pz, vx,vy,vz, k, grow){
    m.group.position.set(px,py,pz);
    m.vx = vx; m.vy = vy; m.vz = vz;
    m.age = 0;
    m.sizeK = k || 1; m._k = 0.001; m.growRate = grow || 3;
    m.breakAt = null; m.spawnT = undefined;
    m.group.scale.setScalar(0.001);
    m.alive = true; m.group.visible = true;
  }
  function _takeDead(){
    var dead = minis.filter(function(m){ return m.isDrifter && !m.alive; });
    return dead.length ? dead[Math.floor(Math.random()*dead.length)] : null;
  }
  function _deadCount(){ var n=0; for(var i=0;i<minis.length;i++) if(minis[i].isDrifter && !minis[i].alive) n++; return n; }

  // ① 主流中的单颗石头（可选：带“碎裂点”的母体 / 预热）
  function _launchFlow(m, opt){
    opt = opt || {};
    var R = _miniShellR();
    var d = {x:_flow.x+_gauss()*0.16, y:_flow.y+_gauss()*0.16, z:_flow.z+_gauss()*0.16}; _norm(d);
    var st = Math.random();
    var speed = (st < 0.3 ? (0.12 + Math.random()*0.10)
               : st < 0.8 ? (0.22 + Math.random()*0.15)
               :            (0.40 + Math.random()*0.20)) * _sizeBias(m) * (opt.speedMul || 1);
    var tgt = _volPoint({x:0,y:0,z:0}, opt.parent ? 0.5 : 0.8);
    var p = {x:tgt.x-d.x*R, y:tgt.y-d.y*R, z:tgt.z-d.z*R};
    if(opt.prewarm){                                              // 开场：石头已经在途中，不是现造
      var f = 0.6 + Math.random()*0.5;
      p.x = tgt.x + d.x*(f-1)*R; p.y = tgt.y + d.y*(f-1)*R; p.z = tgt.z + d.z*(f-1)*R;
    } else _pushOffscreen(p, d, R);
    _arm(m, p.x,p.y,p.z, d.x*speed, d.y*speed, d.z*speed, 1, opt.prewarm ? 0.8 : 3);
    if(opt.parent) m.breakAt = {x:tgt.x, y:tgt.y, z:tgt.z};
  }

  // ② 碰撞碎裂：碎片从母体内部迸出，动量守恒，母体反冲 + 缩小 + 发光
  function _fragment(m){
    var avail = _deadCount();
    var n = Math.min(avail, 4 + Math.floor(Math.random()*5));
    if(n < 2) return;
    var parentK = 0.7, pk3 = parentK*parentK*parentK;
    var u0 = 0.05 + Math.random()*0.07;
    var Px = 0, Py = 0, Pz = 0;
    var pp = m.group.position;
    for(var i=0; i<n; i++){
      var f = _takeDead(); if(!f) break;
      var k = 0.32 + Math.pow(Math.random(), 1.6)*0.45;           // 幂律：小碎片多、大碎片少
      _rndUnit(_su);
      var spd = u0 * Math.sqrt(0.55/k) * (0.7 + Math.random()*0.6);   // 小块更快
      _arm(f, pp.x + _su.x*2, pp.y + _su.y*2, pp.z + _su.z*2,
              m.vx + _su.x*spd, m.vy + _su.y*spd, m.vz + _su.z*spd, k, 2.2);
      f.pulseT = 1;                                                // 断裂瞬间发光
      if(f.rb){ f.rb.w[0] += _gauss()*0.25; f.rb.w[1] += _gauss()*0.25; f.rb.w[2] += _gauss()*0.25; }   // 抛射带来的自旋
      var k3 = k*k*k; Px += _su.x*spd*k3; Py += _su.y*spd*k3; Pz += _su.z*spd*k3;
    }
    m.vx -= Math.max(-0.12, Math.min(0.12, Px/pk3));              // 反冲
    m.vy -= Math.max(-0.12, Math.min(0.12, Py/pk3));
    m.vz -= Math.max(-0.12, Math.min(0.12, Pz/pk3));
    m.sizeK = parentK; m.growRate = 5; m.pulseT = 1;
    if(m.rb){ m.rb.w[0] += _gauss()*0.15; m.rb.w[1] += _gauss()*0.15; m.rb.w[2] += _gauss()*0.15; }
  }
  window._miniFragment = _fragment;

  // ③ 流星体流：同源颗粒沿同一轨道串珠状成团，速度几乎一致
  function _spawnStream(){
    if(_deadCount() >= 3){
      var R = _miniShellR();
      var d = _rndFlowDir({x:0,y:0,z:0});
      d.x = d.x*0.6 + _flow.x*0.4; d.y = d.y*0.6 + _flow.y*0.4; d.z = d.z*0.6 + _flow.z*0.4; _norm(d);
      var tgt = _volPoint({x:0,y:0,z:0}, 0.7);
      var speed = 0.18 + Math.random()*0.20;
      var p0 = {x:tgt.x-d.x*R, y:tgt.y-d.y*R, z:tgt.z-d.z*R};
      _pushOffscreen(p0, d, R);
      var cnt = Math.min(3 + Math.floor(Math.random()*3), _deadCount());
      var gap = 18 + Math.random()*30;
      for(var i=0; i<cnt; i++){
        var m = _takeDead(); if(!m) break;
        var s = speed * (1 + _gauss()*0.04);
        _arm(m, p0.x - d.x*i*gap + _gauss()*8, p0.y - d.y*i*gap + _gauss()*8, p0.z - d.z*i*gap + _gauss()*8,
                d.x*s, d.y*s, d.z*s, 1, 3);
      }
    }
    setTimeout(_spawnStream, 18000 + Math.random()*17000);
  }
  setTimeout(_spawnStream, 12000);

  // ④ 一阵波：一个带陡峭波前的气体脉冲沿同一方向扫过整个空间（见更新循环里的拖曳耦合）
  var _wave = null;
  function _launchWaveStone(m){
    var w = _wave, R = _miniShellR();
    var lat = _volPoint({x:0,y:0,z:0}, 0.9);
    var al = lat.x*w.dir.x + lat.y*w.dir.y + lat.z*w.dir.z;      // 去掉沿传播方向的分量
    var s = Math.max(-w.L*1.05, w.front + _gauss()*w.width*0.5);

  function _startWave(){

  // ══════════════════════════════════════════════════════════════════
  //  主晶体（可点击石头）的“宇宙环境”动力学
  //
  //  它们被锚定在作品入口的位置上，所以建模成“系泊天体”：弹簧–阻尼–受迫振子，
  //  位置 = 锚点 + 偏移 o，轴向 = 基础自转 + 额外角速度 ω。受到：
  //   1) 气体拖曳脉冲（同一道波）：a = (v_gas − v)/t_stop。面积∝s²、质量∝s³ → 大块更迟钝（t_stop 随尺寸增大）。
  //      波前陡、尾部长；过后在回复力下回弹并衰减振铃（欠阻尼）。
  //   2) 拖曳力矩：压力中心与质心不重合，τ = r_cp × F_drag，导致轴向被“拨动”。
  //      之后非弹性内耗（Burns & Safronov 1973）把额外自转阻尼掉，轴向停在新的位置——波过之后朝向已经变了。
  //   3) 恒定的辐射压 / 星风：沿主流方向的微小常力 → 稳态下整体略微“顺风偏斜”，并随主流缓慢转向。
  //   4) YORP 效应（Rubincam 2000）：不对称辐射反冲产生的极慢扭矩，使自转轴（倾角）缓慢漂移。
  //   5) 微流星体撞击：小石头真的飞过晶体时发生动量交换——晶体被轻推并获得微小自旋，小石头被散射并发光。
  //   6) 低频湍流：不可公度频率的弱扰动，避免周期感。
  //
  //  为不影响点击：悬停时偏移被压低；打开面板/聚焦镜头时整体平静下来；偏移有软上限。

  var _ccOut = {x:0, y:0, z:0};

  var _ccT   = 0;
  window._crystalCosmos = function(cr, dt, tt, calm){
    var S = cr._cs;
    if(!S){
      S = cr._cs = {
        ox:0, oy:0, oz:0, vx:0, vy:0, vz:0,
        wx:0, wy:0, wz:0,
        lever: _rndUnit({x:0,y:0,z:0}),                       // 压力中心相对质心的偏移方向
        w0: 0.85 + Math.random()*0.4,                         // 回复力固有频率 rad/s（周期约 5–7 s）
        zeta: 0.25 + Math.random()*0.2,                       // 欠阻尼比
        td: 3 + Math.random()*2.2,                            // 自转内耗时间常数
        yorp: (Math.random()-.5) * 0.03,                      // rad/s，极慢
        ph0: Math.random()*6.283, ph1: Math.random()*6.283, ph2: Math.random()*6.283,
        hitCool: 0
      };
    }
    dt = Math.min(dt, 0.05);
    var p = cr.group.position;
    var inertia = Math.max(0.35, 44 / cr.scale);              // 大块加速度小
    var ax = 0, ay = 0, az = 0;

    // 3) 辐射压 / 星风：沿主流的恒定微力
    ax += _flow.x*4*inertia; ay += _flow.y*4*inertia; az += _flow.z*4*inertia*0.6;
    // 6) 低频湍流
    ax += Math.sin(tt*0.37 + S.ph0)*0.8*inertia;
    ay += Math.sin(tt*0.29 + S.ph1)*0.8*inertia;
    az += Math.sin(tt*0.23 + S.ph2)*0.5*inertia;

    // 1)(2) 同一道波：气体拖曳 + 拖曳力矩
    var w = window._miniWave ? window._miniWave() : null;
    if(w){
      var q = ((p.x*w.dir.x + p.y*w.dir.y + p.z*w.dir.z) - w.front) / w.width;
      if(q > -3 && q < 3){
        var env = q > 0 ? Math.exp(-q*q*3.0) : Math.exp(-q*q*0.6);
        var ts  = 2.0 + cr.scale/25;
        var vg  = w.wind * 60 * 0.55;
        ax += (w.dir.x*vg - S.vx) / ts * env;
        ay += (w.dir.y*vg - S.vy) / ts * env;
        az += (w.dir.z*vg - S.vz) / ts * env * 0.6;
        // τ = r_cp × F ；角惯量 ∝ s²
        var il = (40 / cr.scale); il *= il;
        var tx = S.lever.y*w.dir.z - S.lever.z*w.dir.y;
        var ty = S.lever.z*w.dir.x - S.lever.x*w.dir.z;
        var tz = S.lever.x*w.dir.y - S.lever.y*w.dir.x;
        var kt = 0.16 * env * il * (w.wind/1.1);
        S.wx += (tx + _gauss()*0.15) * kt * dt;
        S.wy += (ty + _gauss()*0.15) * kt * dt;
        S.wz += (tz + _gauss()*0.15) * kt * dt;
      }
    }

    // 5) 微流星体撞击
    S.hitCool -= dt;
    if(S.hitCool <= 0){
      var Rc = cr.scale * 0.55;
      for(var i=0; i<minis.length; i++){
        var m = minis[i];
        if(!m.alive || !m.group.visible || (m._hitUntil && m._hitUntil > tt)) continue;
        var dx = m.group.position.x - p.x, dy = m.group.position.y - p.y, dz = m.group.position.z - p.z;
        var rr = Rc + m.scale*0.5;
        var d2 = dx*dx + dy*dy + dz*dz;
        if(d2 < rr*rr){
          var dl = Math.sqrt(d2) + 1e-6;
          var rvx = m.vx*60 - S.vx, rvy = m.vy*60 - S.vy, rvz = m.vz*60 - S.vz;
          var rl  = Math.sqrt(rvx*rvx + rvy*rvy + rvz*rvz) + 1e-6;
          var mr  = m.scale / cr.scale, kk = Math.min(0.25, 45*mr*mr*mr);   // 质量比（放大后仍很小）
          S.vx += rvx*kk; S.vy += rvy*kk; S.vz += rvz*kk;
          var nx = dx/dl, ny = dy/dl, nz = dz/dl, ux = rvx/rl, uy = rvy/rl, uz = rvz/rl;
          var sk = 0.05 + kk*0.5;                              // 偏心撞击 → 自旋
          S.wx += (ny*uz - nz*uy) * sk; S.wy += (nz*ux - nx*uz) * sk; S.wz += (nx*uy - ny*ux) * sk;
          m.vx += nx*0.06; m.vy += ny*0.06; m.vz += nz*0.06;   // 小石头被散射
          m.pulseT = 1;
          m._hitUntil = tt + 6;
          S.hitCool = 0.4;
          break;
        }
      }
    }

    // 弹簧–阻尼：系泊回复力
    ax -= S.w0*S.w0*S.ox + 2*S.zeta*S.w0*S.vx;
    ay -= S.w0*S.w0*S.oy + 2*S.zeta*S.w0*S.vy;
    az -= S.w0*S.w0*S.oz + 2*S.zeta*S.w0*S.vz;
    S.vx += ax*dt; S.vy += ay*dt; S.vz += az*dt;
    S.ox += S.vx*dt; S.oy += S.vy*dt; S.oz += S.vz*dt;
    // 软上限：不管怎么推，都不会离开入口位置太远
    var cap = cr.isCorner ? 14 : 30, ol = Math.sqrt(S.ox*S.ox + S.oy*S.oy + S.oz*S.oz);
    if(ol > cap){ var g = cap/ol; S.ox *= g; S.oy *= g; S.oz *= g; S.vx *= 0.92; S.vy *= 0.92; S.vz *= 0.92; }

    // 轴向：额外自转经内耗衰减，朝向因此“留”在新位置；YORP 让倾角缓慢漂移
    var dec = Math.exp(-dt / S.td);
    S.wx *= dec; S.wy *= dec; S.wz *= dec;
    var wl = Math.sqrt(S.wx*S.wx + S.wy*S.wy + S.wz*S.wz);
    if(wl > 0.0005){
      _ccAx.set(S.wx/wl, S.wy/wl, S.wz/wl);
      cr.group.rotateOnWorldAxis(_ccAx, wl*dt*calm);
    }
    _ccAx.set(_flow.x, _flow.y, _flow.z);
    cr.group.rotateOnWorldAxis(_ccAx, S.yorp*dt*calm);

    _ccOut.x = S.ox*calm; _ccOut.y = S.oy*calm; _ccOut.z = S.oz*0.6*calm;
    return _ccOut;
  };

  // ⑤ 背景到达率：泊松过程 + 缓慢涨落 + 偶发成团；到达时间间隔指数分布
  function _flux(){ return 1 + 0.5*Math.sin(Date.now()/23000); }
  function _arrivals(){
    var cnt = 1 + (Math.random() < 0.22 ? 1 + Math.floor(Math.random()*2) : 0);
    for(var i=0; i<cnt; i++){
      setTimeout(function(){ var m = _takeDead(); if(m) _launchFlow(m); }, i*(150 + Math.random()*250));
    }
    setTimeout(_arrivals, -Math.log(1 - Math.random()) * 1900 / _flux());
  }
  setTimeout(_arrivals, 500);

  // ⑥ 碰撞碎裂事件：一颗较慢的母体飞进视野中央附近后碎裂
  function _spawnParent(){

    setTimeout(_spawnParent, 28000 + Math.random()*22000);
  }
  setTimeout(_spawnParent, 10000);

  // ⑦ 开场预热：不是“造出来”，而是“流早就在了”——石头已在途中，缓慢显影
  (function(){
    var n = isMobile ? 5 : 14;
    for(var i=0; i<n; i++){
      (function(delay){
        setTimeout(function(){ var m = _takeDead(); if(m) _launchFlow(m, {prewarm:true}); }, delay);
      })(500 + i*120);
    }
  })();
  function updateMouseWorld(ex,ey){
    prevMouseWorld.copy(mouseWorld);
    // Canvas is CANVAS_OVERHANG/2 px to the LEFT of the viewport origin (margin-left:-4vw).
    // clientX is in viewport space. To convert to canvas NDC we shift by the overhang half.
    var cxNdc = ((ex + CANVAS_OVERHANG * 0.5) / CW) * 2 - 1;
    // Unproject to z=0 plane via camera ray
    var ndc = new THREE.Vector3(cxNdc, -(ey/H)*2+1, 0.5);
    ndc.unproject(camera);
    var dir = ndc.sub(camera.position).normalize();
    // Ray-plane intersection at z=0
    // 大角度环绕时射线几乎与 z=0 平面平行，交点会飞到无穷远：限制 t2 的范围
    var _dz = Math.abs(dir.z) < 0.12 ? (dir.z < 0 ? -0.12 : 0.12) : dir.z;
    var t2 = (0 - camera.position.z) / _dz;
    t2 = Math.max(0, Math.min(t2, 4000));
    mouseWorld.set(
      camera.position.x + dir.x*t2,
      camera.position.y + dir.y*t2,
      0
    );
  }

  // Track mouse throw velocity for drag release
  var throwVx=0, throwVy=0;
  // Flag: true when mouse has been stationary long enough that prevMouseWorld is stale.
  // The first mousemove after idle must NOT compute velocity — the coordinate space may
  // have drifted (idle camera drift changes world-unproject results), so the delta
  // (newWorld - staleOldWorld) would be a huge spurious number that throws the crystal far.
  var _mouseWasIdle = true;

  canvas.addEventListener('mousemove',function(e){
    updateMouseWorld(e.clientX, e.clientY);
    if(_mouseWasIdle){
      // First move after idle: prevMouseWorld is stale — zero out velocity and resync.
      throwVx = 0;
      throwVy = 0;
      prevMouseWorld.copy(mouseWorld);
      _mouseWasIdle = false;
    } else {
      throwVx = (mouseWorld.x-prevMouseWorld.x)*0.6;
      throwVy = (mouseWorld.y-prevMouseWorld.y)*0.6;
    }

      _dragCX = e.clientX; _dragCY = e.clientY;
      var _pdx = minis[dragIdx].group.position.x, _pdy = minis[dragIdx].group.position.y;
      _dragUpdate();

  // ── 拖拽：跟手修复 ──

  // z≈-80~-20，drifter 在整个 3D 球壳里），透视下 z≠0 的石头屏幕位移与鼠标不是 1:1，
  // 相机一旋转/漂移就更错位；而且位置只在 mousemove 时更新，相机动而鼠标不动时石头会"掉队"。

  function _dragPlanePoint(cx, cy, depth, out){
    camera.updateMatrixWorld();
    _dV1.set(((cx + CANVAS_OVERHANG * 0.5) / CW) * 2 - 1, -(cy / H) * 2 + 1, 0.5).unproject(camera);

  function _dragUpdate(){

          _dUp.setFromMatrixColumn(camera.matrixWorld, 1);

          _dragOffU = _dV1.dot(_dUp);

      #define CA_REST      0.0002   // 静止时的底噪（旧版固定下限是 0.0008）
      #define CA_MOVE      0.0022   // 运动满强度时的基础分离量

      // bloom 是加法叠加，亮核处 scene+bloom 的 RGB 会超过 1，之前被逐通道硬截断：
      // 金色 (2.3,1.8,0.8) → (1,1,0.8)，R/G 先到顶，色相滑向发白的黄。
      // 这里改成：只压缩最亮的那个通道，再让三个通道乘同一个比例 → R:G:B 比例不变 → 色相不变。
      // knee 以下原样输出（不改变你已经调好的整体影调）；knee 以上用指数曲线平滑地逼近 1.0，
      // 在 knee 处一阶连续，没有"折角"。
      vec3 softShoulder(vec3 c, float knee){

        if(m <= knee) return c;
        float w  = 1.0 - knee;
        float mp = knee + w * (1.0 - exp(-(m - knee) / w));

      #define FXAA_EDGE_THRESHOLD     0.125  // min contrast to trigger AA

      // Improvements over the previous 5-tap version:

      //   · Bidirectional edge search along detected edge orientation
      //   · Correct NE/NW/SE/SW luma weighting (corners weighted 2x cardinals)

      // Ref: github.com/mattdesl/glsl-fxaa

        float FXAA_SPAN_MAX   = 8.0;

        // Corner samples — computed relative to this call's uv center
        vec3 rgbNW = texture2D(tex, uv + vec2(-texelSize.x, -texelSize.y)).rgb;
        vec3 rgbNE = texture2D(tex, uv + vec2( texelSize.x, -texelSize.y)).rgb;
        vec3 rgbSW = texture2D(tex, uv + vec2(-texelSize.x,  texelSize.y)).rgb;
        vec3 rgbSE = texture2D(tex, uv + vec2( texelSize.x,  texelSize.y)).rgb;
        vec4 rgbM4 = texture2D(tex, uv);
        vec3 rgbM  = rgbM4.rgb;

        float lumaNW = luma(rgbNW);
        float lumaNE = luma(rgbNE);
        float lumaSW = luma(rgbSW);
        float lumaSE = luma(rgbSE);
        float lumaM  = luma(rgbM);

        float lumaMin = min(lumaM, min(min(lumaNW, lumaNE), min(lumaSW, lumaSE)));
        float lumaMax = max(lumaM, max(max(lumaNW, lumaNE), max(lumaSW, lumaSE)));

        // Early exit — below contrast threshold, no AA needed
        if((lumaMax - lumaMin) < max(FXAA_EDGE_THRESHOLD_MIN, lumaMax * FXAA_EDGE_THRESHOLD)){

        }

        vec2 dir;
        dir.x = -((lumaNW + lumaNE) - (lumaSW + lumaSE));
        dir.y =  ((lumaNW + lumaSW) - (lumaNE + lumaSE));

        float dirReduce = max(
          (lumaNW + lumaNE + lumaSW + lumaSE) * (0.25 * FXAA_REDUCE_MUL),

      _matComposite.uniforms.uZoomCenter.value.set(_zcV.x * 0.5 + 0.5, _zcV.y * 0.5 + 0.5);
    }

    var _sw = window._sceneState.shockWaves, _rp = _matComposite.uniforms.uRip.value;
    for(var _ri = 0; _ri < 2; _ri++){
      var _w = _sw[_sw.length - 1 - _ri], _v4 = _rp[_ri];
      if(!_w){ _v4.w = 0; continue; }
      var _pg = _w.radius / _w.maxRadius;                           // 0→1 生命周期
      var _in = Math.min(1, _w.radius / 36);                        // 起步 ~2.5 帧淡入，避免首帧一个硬圈
      var _fa = Math.pow(1 - _pg, 1.6);                             // 越扩散越弱
      _v4.set((_w.x + CANVAS_OVERHANG*0.5) / CW, 1 - _w.y / H, _w.radius / H,

    renderer.setRenderTarget(fboExtract);  renderer.render(_extractScene, _orthoCam);
    renderer.setRenderTarget(fboDown);     renderer.render(_downScene,    _orthoCam);
    renderer.setRenderTarget(fboDown2);    renderer.render(_down2Scene,   _orthoCam);
    renderer.setRenderTarget(fboUp2);      renderer.render(_up2Scene,     _orthoCam);
    renderer.setRenderTarget(fboUp);       renderer.render(_upScene,      _orthoCam);

  // Ref: Chrome DevTools blog — animating blur is expensive; long transition = fewer costly frames.
  // Trigger: random interval 9–22s, skipped on low-end / panel open / lightbox open.
  // Max blur 0.55px — felt but not noticed. Return slower than departure (re-focus takes longer).
  //
  // Depth-of-field layering: three elements blur together as a single focal plane —
  //   #three          (Three.js crystals + bloom)
  //   #constellation  (constellation lines canvas)
  //   labelContainer  (crystal text labels)
  // All share the same blur value and transition so they read as one unified camera lens,
  // not three independent layers. Labels ride the same focal plane as the crystals they label.
  if(window._perfTier !== 'low' && !isMobile){
    var _lensEl   = document.getElementById('three');
    var _conEl    = document.getElementById('constellation');
    var _bgEl     = document.getElementById('bg'); // stars + planet canvas — inset:-12px already bleeds past edge, so blur fringe is hidden
    var _labelCon = window._labelContainer; // labelContainer lives in a separate IIFE — access via window

    var _lensResetTmr = null; // handle for the _lensBlurred reset timer — clearTimeout-able

    var _lensIdleTimer = null;

      clearTimeout(_lensIdleTimer);
      _lensIdleTimer = setTimeout(function(){ _lensIdleReady = true; }, 10000);
    }

    // On refocus, bg clears with 1.3x duration — background takes longer to resolve than subject.
    function _setScene(blurVal, durationMs, easing){
      var t = 'filter ' + durationMs + 'ms ' + easing;
      _lensEl.style.transition = 'transform 1.6s cubic-bezier(.4,0,.1,1), ' + t;
      _lensEl.style.filter     = 'blur(' + blurVal + 'px)';
      _conEl.style.transition  = t;
      _conEl.style.filter      = 'blur(' + blurVal + 'px)';

      var bgDur  = Math.round(durationMs * 1.3);
      _bgEl.style.transition = 'filter ' + bgDur + 'ms ' + easing;
      _bgEl.style.filter     = 'blur(' + bgBlur + 'px)';
    }

    // 而不是让 #three/#constellation/#bg/全部标签 这几张整屏图层的 blur 过渡
    // 与聚焦镜头、面板 backdrop-filter 同时逐帧重算（这是“概率性”掉帧的主因）。
    window._lensRefocusNow = function(){
      if(!_lensBlurred) return;

      _setScene(0, 420, ease);
      (window._labelEls || []).forEach(function(el){ _setLabel(el, 0, 420, ease); });
    };

    function _scheduleLens(){
      // 6–14s base interval — full cycle including blur+hold+refocus lands at ~10–19s perceived gap
      // Incommensurate range ensures it never locks into a detectable rhythm
      var delay = 6000 + Math.random() * 8000;
      setTimeout(function(){
        var panelOn = document.body.classList.contains('panel-open');
        var _lbEl   = document.getElementById('lb');
        var lbOn    = _lbEl ? _lbEl.classList.contains('on') : false;
        if(!panelOn && !lbOn && _lensIdleReady){
          var els = window._labelEls || [];

          // ── Three weight tiers — each breath is drawn randomly ──
          // Light  (55%): subtle drift, short hold — the everyday breath
          // Deep   (30%): heavy blur, normal hold — lens hunting focus
          // Linger (15%): deep blur, long hold — camera lost in the void
          var roll = Math.random();

          if(roll < 0.55){
            // Light — 2.0–3.0px, hold 0.6–1.0s
            amt        = (2.0 + Math.random() * 1.0).toFixed(2);
            holdTime   = 600  + Math.random() * 400;
            defocusMs  = 2000;
          } else if(roll < 0.85){
            // Deep — 3.5–5.5px, hold 1.0–1.8s
            amt        = (3.5 + Math.random() * 2.0).toFixed(2);
            holdTime   = 1000 + Math.random() * 800;
            defocusMs  = 2200;
          } else {
            // Linger — 5.0–7.5px, hold 2.5–4.5s — rare, cinematic
            amt        = (5.0 + Math.random() * 2.5).toFixed(2);
            holdTime   = 2500 + Math.random() * 2000;
            defocusMs  = 2600;
          }

          _setScene(amt, defocusMs, 'cubic-bezier(.4,0,.2,1)');
          els.forEach(function(el){
            _setLabel(el, amt, defocusMs, 'cubic-bezier(.4,0,.2,1)');
          });
          _lensBlurred = true;

          // ── Refocus: scene clears first, then labels stagger back independently ──
          setTimeout(function(){

            // shuffle indices so different crystals lead each time, never the same order
            var indices = els.map(function(_, i){ return i; });
            // Fisher-Yates shuffle
            for(var i = indices.length - 1; i > 0; i--){
              var j = Math.floor(Math.random() * (i + 1));
              var tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
            }

            // Group size varies so it never feels like a fixed pattern
            var groupCount = 3 + Math.floor(Math.random() * 2); // 3 or 4 groups
            var used = 0;
            var cumDelay = 0;

            // Track the exact finish time of the last label transition so we can
            // reset _lensBlurred precisely when all animations are done — not via a
            // fixed time estimate that can run short.
            // Pattern: collect all (gDelay + jitter + transitionMs) values, take the max,
            // then set ONE clearTimeout-able timer for exactly that duration.
            // Ref: MDN clearTimeout — store the handle and cancel/replace as needed.
            var _latestFinish = 0;

            for(var g = 0; g < groupCount; g++){
              // Last group gets all remaining
              var size = g === groupCount - 1
                ? indices.length - used
                : 1 + Math.floor(Math.random() * Math.ceil((indices.length - used) / (groupCount - g)));
              size = Math.min(size, indices.length - used);
              if(size <= 0) break;

              var groupIndices = indices.slice(used, used + size);
              used += size;

              // Accumulate delay — first group near-instant, rest stagger 150–450ms apart
              cumDelay += g === 0 ? Math.floor(Math.random() * 200) : 150 + Math.floor(Math.random() * 300);

              // Upper-bound estimate computed synchronously (jitter ≤ 80ms, transMs ≤ 900ms).
              // The async callbacks update _latestFinish with exact values, but
              // _lensResetTmr is set right after the for-loop (before any callback fires),
              // so we need a synchronous estimate here to seed a valid initial value.
              _latestFinish = Math.max(_latestFinish, cumDelay + 80 + 900);

              (function(gDelay, gIndices){
                setTimeout(function(){
                  gIndices.forEach(function(idx){
                    if(els[idx]){
                      // Tiny per-label jitter within the group — 0–80ms
                      var jitter = Math.floor(Math.random() * 80);
                      var transMs = 600 + Math.floor(Math.random() * 300);
                      setTimeout(function(){
                        _setLabel(els[idx], 0, transMs, 'cubic-bezier(.22,1,.36,1)');
                      }, jitter);
                      // Refine with exact values once we're inside the callback
                      _latestFinish = Math.max(_latestFinish, gDelay + jitter + transMs);
                    }
                  });
                }, gDelay);
              })(cumDelay, groupIndices);
            }

            // Reset _lensBlurred exactly when the last label finishes — no guesswork.
            // Add 50ms buffer for browser paint jitter (MDN: setTimeout is minimum delay,
            // actual firing can be slightly later under load).
            if(_lensResetTmr) clearTimeout(_lensResetTmr);
            _lensResetTmr = setTimeout(function(){
              _lensBlurred = false;
              _lensResetTmr = null;
            }, _latestFinish + 50);
          }, holdTime);
        }
        _scheduleLens();
      }, delay);
    }
    // Start after intro is done — don't interfere with crystal landing
    setTimeout(_scheduleLens, 5500);
  }
  window.addEventListener('resize',function(){
    W=window.innerWidth; H=window.innerHeight;
    CANVAS_OVERHANG = Math.round(W * 0.08);
    CW = W + CANVAS_OVERHANG;
    renderer.setPixelRatio(_pxRatio());
    renderer.setSize(CW, H, false);
    canvas.style.width  = CW + 'px';
    canvas.style.height = H + 'px';
    camera.aspect=CW/H; camera.updateProjectionMatrix();
    conCanvas.width=W; conCanvas.height=H;
    // Recalculate visible world dimensions so mini crystal spawn bounds stay accurate
    var _aspect = W/H;
    var _visH = 520 * Math.tan(27.5 * Math.PI/180);
    visH = _visH;
    visW = _visH * _aspect;
  });

  // Orientation change — crystal positions are baked at init, reload to recalculate
  if(isMobile){
    window.addEventListener('orientationchange', function(){
      setTimeout(function(){ location.reload(); }, 400);
    });
  }

})();
</script>

             遮挡窗仍在，所以不会穿到 tab 栏前面）。
           · 手机端：保持原子交接（避免手机 GPU 对带滤镜+裁切的图层做 opacity 动画），
             但同样延后到黑底淡完之后，不再与黑底的毛玻璃淡出同帧换层。 */
        var _narrow = window.innerWidth <= 768;
        tail.timer = setTimeout(function(){
          tail.timer = 0;
          if(_lbTail !== tail) return;               // 期间被取消（又打开了灯箱）
          if(_partial && _narrow){
            tail.timer = setTimeout(function(){
              tail.timer = 0;
              if(_lbTail !== tail) return;
              requestAnimationFrame(function(){ requestAnimationFrame(_finish); });
            }, OUT - 50);                            // 总时长仍落在 _lbFlyOut 返回的 650ms 之内
            return;
          }
          if(_partial){                              // 桌面端半遮挡：先让下方缩略图稳定绘制两帧，再开始交叉淡出
            requestAnimationFrame(function(){ requestAnimationFrame(function(){
              if(_lbTail !== tail) return;
              try{
                fadeAnim = img.animate([{ opacity: 1 }, { opacity: 0 }],
                                       { duration: OUT - 30, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
                tail.fade = fadeAnim;
                fadeAnim.onfinish = function(){ _finish(); };
              }catch(e){ _finish(); }
            }); });
            return;
          }
          try{
            fadeAnim = img.animate([{ opacity: 1 }, { opacity: 0 }],
                                   { duration: OUT, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
            tail.fade = fadeAnim;
            fadeAnim.onfinish = function(){ _finish(); };
          }catch(e){ _finish(); }
        }, Math.max(0, IN - OVERLAP));
      };
      return 300 + (180 - 60) + 170 + 60;   // 飞行 300 + 缩略图淡入先行 120 + 飞行图淡出 170 + 余量
    }
    if(curTf) img.style.transform = curTf;
  }
  // 降级：图片自身缩小淡出
  if(img.getAttribute('src') && img.style.opacity !== '0'){
    _lbAnim = img.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.92)' }],
                          { duration: 320, easing: _LB_EASE, fill: 'forwards' });
  }
  return 350;
}

function _lbShow(idx, opening){
  _lbStop();
  _lbCancelAnim();
  var tok = ++_lbTok;
  if(window._lbResetZoom) window._lbResetZoom(true);
  var d    = _lbMeta[idx] || {title:'',en:'',desc:''};
  var el   = document.querySelector('[data-lbidx="'+idx+'"]');
  var src  = (el && el.getAttribute('data-lbsrc')) || '';
  if(!src && el){ var _fi = el.querySelector('img'); if(_fi) src = _fi.getAttribute('src') || _fi.src || ''; }
  var img  = document.getElementById('lbImg');
  var side = document.getElementById('lbSide');
  var spin = document.getElementById('lbSpinner');

  // 立刻隐藏旧图和文字
  img.classList.remove('lb-fadein');
  img.style.opacity = '0';
  side.style.opacity = '0';

  // 80ms 后没回来就显示 spinner
  _lbTmr = setTimeout(function(){ spin.classList.add('vis'); }, 80);

  function commit(){
    _lbStop(); // 清 spinner + timer
    img.src = src;
    document.getElementById('lbTitle').textContent = d.title;
    document.getElementById('lbEn').textContent    = d.en;
    document.getElementById('lbIdx').textContent   = '';
    document.getElementById('lbDesc').textContent  = (d.desc || '').replace(/\n\n/g,'\n');
    if(opening){
      // 打开：图片保持 opacity:0，等布局稳定后由 _lbFlyIn 接管（飞入或降级淡入）
      return;
    }
    // 切图：模糊淡入
    img.style.opacity = '';
    void img.offsetWidth;
    img.classList.add('lb-fadein');
    side.style.opacity = '1';
    var _b2 = document.querySelector('.lb-btns'); if(_b2){ _b2.style.pointerEvents = ''; _b2.style.opacity = '1'; }
  }

  // 布局设置完后：打开 → 等图片 decode 再量位置飞入；切图 → 只换隐藏的缩略图
  function afterLayout(){
    if(opening){
      // go 只会执行一次；decode 卡住/永不返回时由 700ms 定时器兜底，避免灯箱一直停在 opacity:0
      var fired = false;
      var go = function(){ if(fired) return; fired = true; if(tok === _lbTok && _lbIsOn) _lbFlyIn(idx, tok); };
      var dp = null;
      try{ dp = img.decode ? img.decode() : null; }catch(e){ dp = null; }
      if(dp && dp.then) dp.then(go, go); else go();
      setTimeout(go, 700);
    } else {
      _lbHideThumb(_lbThumbOf(idx));
    }
    _lbGuard(idx, tok);
  }

  var _tries = 0;

  function layoutDesktop(nw, nh){
    var lbImgEl  = document.getElementById('lbImg');
    var lbImgBox = document.getElementById('lbImgBox');
    var lbColEl  = document.querySelector('.lb-col');
    var lbSideEl = document.getElementById('lbSide');
    // 先复位，再按横/竖图重新设定
    lbImgEl.style.width=''; lbImgEl.style.maxWidth=''; lbImgEl.style.maxHeight=''; lbImgEl.style.objectFit='';
    if(lbImgBox) lbImgBox.style.width='';
    if(lbColEl)  lbColEl.style.width='';
    if(lbSideEl){ lbSideEl.style.position=''; lbSideEl.style.transform='';
      lbSideEl.style.left=''; lbSideEl.style.top=''; lbSideEl.style.width=''; lbSideEl.style.marginTop=''; }
    if(nw && nh && nw > nh){
      lbImgEl.style.width='auto'; lbImgEl.style.maxWidth='78vw';
      lbImgEl.style.maxHeight='72vh'; lbImgEl.style.objectFit='contain';
      if(lbColEl) lbColEl.style.width='fit-content';
      if(lbSideEl){ lbSideEl.style.position='static'; lbSideEl.style.transform='none';
        lbSideEl.style.left='auto'; lbSideEl.style.top='auto';
        lbSideEl.style.width='100%'; lbSideEl.style.marginTop='14px'; }
    }
  }

  function _handleLoaded(pre){
    if(_lbPre !== pre || tok !== _lbTok) return;
    pre.onload = null; pre.onerror = null;
    src = pre.currentSrc || pre.src;   // 若走了重试地址，用真正加载成功的那个
    commit();
    if(window.innerWidth > 768) layoutDesktop(pre.naturalWidth, pre.naturalHeight);
    _lbFitSide();
    afterLayout();
  }

  function load(url){
    var pre = new Image();
    _lbPre = pre;
    pre.onload  = function(){ _handleLoaded(pre); };
    pre.onerror = function(){
      if(_lbPre !== pre || tok !== _lbTok) return;
      pre.onload = null; pre.onerror = null;
      if(_tries++ < 2){
        // 加载失败（请求被中断/缓存里是残缺数据）：加时间戳绕过坏缓存重试
        setTimeout(function(){
          if(tok !== _lbTok || !_lbIsOn) return;
          load(src + (src.indexOf('?') < 0 ? '?' : '&') + '_lb=' + Date.now());
        }, 200 * _tries);
      } else {
        _lbStop();
      }
    };
    pre.src = url;
    if(pre.complete && pre.naturalWidth){ _handleLoaded(pre); }
  }
  if(!src){ _lbStop(); return; }
  load(src);
}


// 兜底：灯箱已打开、本次 tok 仍有效，但图片仍不可见（decode/动画/加载任一环节掉链子）→ 强制显示
function _lbGuard(idx, tok){
  setTimeout(function(){
    if(tok !== _lbTok || !_lbIsOn) return;
    var img = document.getElementById('lbImg');
    var box = document.getElementById('lbImgBox');
    if(!img.getAttribute('src') || !img.naturalWidth){
      // 图片没加载出来：直接用缩略图的地址再试一次
      var t = _lbThumbOf(idx);
      if(t && (t.currentSrc || t.src)){
        img.onload = function(){ img.onload = null; _lbGuardReveal(tok); };
        img.src = t.currentSrc || t.src;
      }
      return;
    }
    _lbGuardReveal(tok);
  }, 1500);
  setTimeout(function(){ _lbGuardReveal(tok); }, 900);
  setTimeout(function(){ _lbGuardReveal(tok); }, 2600);
}
function _lbGuardReveal(tok){
  if(tok !== _lbTok || !_lbIsOn) return;
  var img = document.getElementById('lbImg');
  var box = document.getElementById('lbImgBox');
  var flying = _lbAnim && _lbAnim.playState === 'running';
  if(flying) return;
  document.getElementById('lb').style.visibility = 'visible';
  img.style.visibility = 'visible';
  // 1) 清掉所有「没被登记」的残留 WAAPI 动画（fill:forwards 的透明/裁切会让图片一直不可见）
  [img, box].forEach(function(el){
    if(!el || !el.getAnimations) return;
    el.getAnimations().forEach(function(a){
      if(a.animationName) return;                 // CSS 的 lb-fadein 不动
      if(a === _lbAnim || a === _lbAnimBox) return;
      try{ a.cancel(); }catch(e){}
    });
  });
  // 2) 飞行已结束：裁切、位移、透明度一律回到「正常显示」
  if(box && !_lbAnimBox) box.style.clipPath = '';
  if(!_lbAnim){
    if((window._lbScale || 1) <= 1.02) img.style.transform = '';
    var op = parseFloat(getComputedStyle(img).opacity);
    if(img.style.opacity === '0' || op < 0.05){
      document.getElementById('lbSpinner').classList.remove('vis');
      img.style.opacity = '';
      img.classList.remove('lb-fadein');
      void img.offsetWidth;
      img.classList.add('lb-fadein');
    }
  }
  _lbFitSide();
  document.getElementById('lbSide').style.opacity = '1';
  var _b3 = document.querySelector('.lb-btns'); if(_b3){ _b3.style.pointerEvents = ''; _b3.style.opacity = '1'; }
  // 3) 缩略图应保持隐藏（与灯箱图一一对应）
  var t = _lbThumbOf(curLbIdx);
  if(t && _lbThumb !== t) _lbHideThumb(t);
}

function openLb(idx){
  // Clear cursor hover state — same reason as openPanel
  if(typeof hoveredIdx !== 'undefined'){ hoveredIdx = -1; }
  document.body.classList.remove('hovering');
  curLbIdx  = String(idx); // always string — _lbSibs entries are strings from getAttribute()
  _lbSibs   = _lbGetSiblings();
  var btns = document.querySelector('.lb-btns');
  if(btns){ btns.style.transitionDuration = ''; btns.style.pointerEvents = 'none'; btns.style.opacity = '0'; }   // 飞入完成前不显示、不接收指针
  var img   = document.getElementById('lbImg');
  var side  = document.getElementById('lbSide');
  _lbCancelCloseCleanup();      // 取消尚未执行的关闭清理，否则会把新图清掉
  _lbStop();
  _lbCancelAnim();
  _lbRestoreThumb();
  img.classList.remove('lb-fadein');
  img.onload = null;
  img.style.opacity = '0';
  img.style.transform = '';
  img.style.transition = '';
  var _bx = document.getElementById('lbImgBox'); if(_bx) _bx.style.clipPath = '';
  var _wr = document.querySelector('.lb-wrap'); if(_wr){ _wr.style.transform = ''; _wr.style.transition = ''; _wr.style.opacity = ''; }
  side.style.opacity = '0';
  var lb = document.getElementById('lb');
  lb.classList.add('on');
  lb.style.visibility = 'visible';        // 不依赖 .lb 的 visibility 延迟过渡（快速开合时它会卡在 hidden）
  img.style.visibility = 'visible';

  document.body.style.overflow = 'clip';

function closeLb(){
  var lb = document.getElementById('lb');
  if(!lb.classList.contains('on')) return;   // 已经在关闭中，避免重复触发
  window._lbClosedAt = Date.now();           // 供 closePanel 判断：同一次 Esc 只关灯箱
  _lbStop();
  _lbTok++;                                  // 作废还在排队的飞入/侧栏淡入
  var _resetDelay = _lbFlyOut();             // 先读缩略图位置并启动飞回，再改任何布局
  var btns = document.querySelector('.lb-btns');
  if(btns){ btns.style.transitionDuration = ''; btns.style.pointerEvents = 'none'; btns.style.opacity = '0'; }
  var sideEl = document.getElementById('lbSide');
  if(sideEl) sideEl.style.opacity = '0';
  lb.classList.remove('on');
  _lbIsOn = false;
  lb.removeEventListener('touchmove', window._lbTouchMoveProxy);
  lb.style.alignItems = '';
  lb.style.overflowY  = '';
  document.body.style.overflow = '';
  if(_lbCloseTmr){ clearTimeout(_lbCloseTmr); _lbCloseTmr = null; }
  // 等飞回动画（含落地交接）完成后再重置样式
  _lbCloseTmr = setTimeout(function(){
    _lbCloseTmr = null;
    if(_lbIsOn) return;             // 期间又打开了，绝不能把新图清掉
    document.getElementById('lb').style.visibility = 'hidden';   // 立即隐藏：.lb 的 visibility 过渡有 .78s 延迟，期间重置后的空卡片会露出来
    Array.prototype.forEach.call(document.querySelectorAll('.lb-fly-proxy'), function(n){ if(n.parentNode) n.parentNode.removeChild(n); });
    var img    = document.getElementById('lbImg');
    var imgBox = document.getElementById('lbImgBox');
    var colEl  = document.querySelector('.lb-col');
    var wrapEl = document.querySelector('.lb-wrap');
    _lbCancelAnim();
    _lbRestoreThumb();
    if(window._lbResetZoom) window._lbResetZoom(true);
    img.classList.remove('lb-fadein');
    img.src = 'about:blank'; img.style.opacity = '0';
    img.style.transform = ''; img.style.transition = '';
    img.style.width=''; img.style.maxWidth=''; img.style.maxHeight=''; img.style.objectFit='';
    if(imgBox) { imgBox.style.width=''; imgBox.style.clipPath=''; }
    if(colEl)  { colEl.style.width=''; }
    if(wrapEl) { wrapEl.style.transition=''; wrapEl.style.transform=''; wrapEl.style.opacity=''; }
    if(sideEl) { sideEl.style.opacity='0'; sideEl.style.position=''; sideEl.style.transform=''; sideEl.style.left=''; sideEl.style.top=''; sideEl.style.width=''; sideEl.style.marginTop=''; }
    if(btns) btns.style.opacity = '0';
  }, _resetDelay);
}

// 兼容旧调用：取消 closeLb 的延迟清理
function _lbCancelCloseCleanup(){
  if(_lbCloseTmr){ clearTimeout(_lbCloseTmr); _lbCloseTmr = null; }
}

// ── 导航按钮：阻止事件冒泡到 lb 容器，避免触发关闭 ──
['lbPrev','lbNext','lbClose'].forEach(function(id){
  var el = document.getElementById(id);
  el.addEventListener('click',      function(e){ e.stopPropagation(); });
  el.addEventListener('touchstart', function(e){ e.stopPropagation(); }, {passive:true});
  el.addEventListener('touchend',   function(e){ e.stopPropagation(); }, {passive:true});
});
document.getElementById('lbClose').addEventListener('click', function(e){ e.stopPropagation(); closeLb(); });
document.getElementById('lbPrev').addEventListener('click', function(e){
  e.stopPropagation();
  var p = _lbSibs.indexOf(curLbIdx);
  curLbIdx = _lbSibs[(p - 1 + _lbSibs.length) % _lbSibs.length];
  _lbShow(curLbIdx);
});
document.getElementById('lbNext').addEventListener('click', function(e){
  e.stopPropagation();
  var p = _lbSibs.indexOf(curLbIdx);
  curLbIdx = _lbSibs[(p + 1) % _lbSibs.length];
  _lbShow(curLbIdx);
});

// ── lb 容器：tap/click 关闭灯箱 ──
// 设计原则（参考 yet-another-react-lightbox / fslightbox 等主流实现）：
//   • 用 e.target.closest() 做目标检测，而非依赖 stopPropagation 冒泡拦截。
//     stopPropagation 需要在每一个子元素上分别绑定，极易遗漏；
//     closest() 在根监听器里一次判断，touch 和 click 共用同一函数，零遗漏。
//   • 禁止关闭区域：图片(.lb-img)、左右按钮(.lb-btns-left)——
//     点击这些区域不关闭灯箱。
//   • 允许关闭区域：close 按钮、文字说明区、灯箱空白背景。
(function(){
  var lbEl = document.getElementById('lb');
  var _tsx = 0, _tsy = 0;
  window._lbSwipeHandled = false;

  // 判断点击目标是否落在"禁止关闭"区域内
  function _isBlockedTarget(el){
    if(!el) return false;
    // 图片区域（含 spinner）
    if(el.closest('#lbImgBox')) return true;
    // 左右导航按钮区域
    if(el.closest('.lb-btns-left')) return true;
    return false;
  }

  lbEl.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    _tsx = e.touches[0].clientX;
    _tsy = e.touches[0].clientY;
    window._lbSwipeHandled = false;
  }, {passive:true, capture:true});

  lbEl.addEventListener('touchend', function(e){
    if(!lbEl.classList.contains('on')) return;
    if(window._lbSwipeHandled) return;
    if(e.changedTouches.length !== 1) return;
    // 目标检测：禁止关闭区域内的 tap 直接跳过
    if(_isBlockedTarget(e.target)) return;
    var ex = e.changedTouches[0].clientX;
    var ey = e.changedTouches[0].clientY;
    if(Math.abs(ex - _tsx) < 20 && Math.abs(ey - _tsy) < 20){
      e.preventDefault();
      closeLb();
    }
  }, {passive:false, capture:false});

  // 桌面端 click 兜底（同样做目标检测）
  lbEl.addEventListener('click', function(e){
    if(_isBlockedTarget(e.target)) return;
    closeLb();
  });
})();

document.addEventListener('keydown', function(e){
  if(!document.getElementById('lb').classList.contains('on')) return;
  if(e.key === 'Escape'){ closeLb(); return; }
  var p = _lbSibs.indexOf(curLbIdx);
  if(e.key === 'ArrowLeft'){ curLbIdx = _lbSibs[(p - 1 + _lbSibs.length) % _lbSibs.length]; _lbShow(curLbIdx); }
  else if(e.key === 'ArrowRight'){ curLbIdx = _lbSibs[(p + 1) % _lbSibs.length]; _lbShow(curLbIdx); }
});

// ── Touch: swipe-down to close + swipe-left/right to navigate ──
(function(){
  var lb   = document.getElementById('lb');
  var wrap = document.querySelector('.lb-wrap');
  var sx=0, sy=0, swDir=null, tracking=false;
  var dyAcc=0, dyRaw=0;
  var _touchStartTime = 0;

  // Stable proxy — defined before _lbTouchMove so openLb() can always bind it
  window._lbTouchMoveProxy = function(e){
    if(typeof window._lbTouchMove === 'function') window._lbTouchMove(e);
  };

  window._lbTouchMove = function lbTouchMove(e){
    if(!tracking || e.touches.length > 1) return;

    if(window._lbScale > 1.05) return;
    var dx  = Math.abs(e.touches[0].clientX - sx);
    var dy  = e.touches[0].clientY - sy;
    var ady = Math.abs(dy);

      if(dx < 12 && ady < 18) return;

      swDir = dx > ady * 1.4 ? 'h' : 'v';
    }
    if(swDir === 'v'){
      // 只有明确向下滑时才允许退出，向上滑（负值）直接忽略
      if(dy < 0){ return; }

      dyRaw = dy;
      dyAcc = dy * 0.28;

    }

    if(e.touches.length > 1){ tracking = false; swDir = null; dyAcc = 0; dyRaw = 0; return; }
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    tracking = true;
    swDir = null;
    dyAcc = 0;
    dyRaw = 0;
    _touchStartTime = Date.now();
    wrap.style.transition = 'none';
  }, {passive:true});

  lb.addEventListener('touchend', function(e){

      if(dyRaw > 80){

        closeLb();
      } else {
        wrap.style.transition = 'transform 0.45s cubic-bezier(0.34,1.56,0.64,1)';
        wrap.style.transform  = 'translateY(0)';
      }
      dyAcc = 0; dyRaw = 0;
      return;
    }

    // 缩放状态下不处理 tap/swipe
    if(window._lbScale > 1.05){ window._lbSwipeHandled = true; return; }

    // 横滑分支
    if(swDir === 'h'){
      window._lbSwipeHandled = true;
      var dx = endX - sx;
      if(Math.abs(dx) < 50) return;
      var p = _lbSibs.indexOf(curLbIdx);
      curLbIdx = dx < 0
        ? _lbSibs[(p + 1) % _lbSibs.length]
        : _lbSibs[(p - 1 + _lbSibs.length) % _lbSibs.length];
      _lbShow(curLbIdx);
      return;

  }, {passive:true});

    tracking = false;
    dyAcc = 0; dyRaw = 0;
